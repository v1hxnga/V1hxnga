ttom:12px}.sh h3{font-size:24px;letter-spacing:-.04em;margin:0}.sh p{margin:4px 0 0;color:var(--m);font-size:13px}.live{font-size:11px;font-weight:900;color:var(--g)}.cards{grid-template-columns:repeat(4,1fr)}.card,.project,.module,.row,.cost{background:#ffffffed;border:1px solid var(--l);border-radius:22px;box-shadow:0 14px 32px #14213d0b}.card{padding:18px}.card b{display:block;font-size:30px;letter-spacing:-.05em;margin:7px 0}.trend{font-size:12px;color:var(--g);font-weight:800}.warn{color:var(--a)}.priority{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.row{padding:18px;text-align:left;cursor:pointer;border:1px solid var(--l)}.ico{width:46px;height:46px;border-radius:15px;background:#fff0e9;color:var(--o);display:grid;place-items:center;font-size:20px;font-weight:900;margin-bottom:14px}.row b{display:block;font-size:18px;letter-spacing:-.03em}.row p{color:var(--m);font-size:13px;line-height:1.55;min-height:62px}.tag{display:inline-block;padding:7px 9px;border-radius:99px;background:#fff0e9;color:var(--o);font-size:10px;font-weight:900}.projects{grid-template-columns:1fr}.project{padding:20px;cursor:pointer}.pt{display:flex;justify-content:space-between}.project h3{font-size:25px;margin:0 0 4px;letter-spacing:-.04em}.project p{color:var(--m);font-size:13px;margin:0}.health{color:var(--g);font-size:11px;font-weight:900;background:#e8f7f1;padding:8px 10px;border-radius:99px;height:max-content}.health.att{color:var(--a);background:#fff4df}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{background:#f4f6f8;border:1px solid #edf0f3;border-radius:15px;padding:13px}.stat b{display:block;font-size:22px;margin-top:5px}.note{font-size:13px!important;line-height:1.55;margin-top:12px!important}.modules{grid-template-columns:repeat(3,1fr)}.module{padding:20px;text-align:left;cursor:pointer}.module .mi{width:50px;height:50px;border-radius:16px;background:#eaf2ff;color:#4c8dff;display:grid;place-items:center;font-size:20px;margin-bottom:17px}.module b{font-size:18px;display:block}.module p{font-size:13px;color:var(--m);line-height:1.55;min-height:60px}.cost{padding:24px}.cost .big{font-size:49px;font-weight:900;letter-spacing:-.06em}.cost>p{color:var(--m);font-size:14px;line-height:1.6}.bars div{font-size:12px;color:#526073;margin-top:15px;font-weight:700}.bar{height:10px;background:#e7ebef;border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#102343,#355985);border-radius:99px}.bar.o i{background:linear-gradient(90deg,var(--o),#ff9a70)}.bar.g i{background:linear-gradient(90deg,var(--g),#4dcd9c)}.modal{position:fixed;inset:0;z-index:70;background:#07122599;backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px}.sheet{width:min(760px,100%);background:linear-gradient(#fff,#f7f9fc);border-radius:26px;padding:24px;box-shadow:0 30px 70px #07122555}.close{float:right;border:0;background:#edf1f5;border-radius:12px;width:40px;height:40px;font-weight:900;font-size:18px}.sheet h2{font-size:30px;letter-spacing:-.05em;margin:2px 0 8px}.sheet>p{color:var(--m);line-height:1.6;font-size:14px}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}.d{background:#fff;border:1px solid var(--l);border-radius:15px;padding:13px}.d small{font-size:10px;color:#7b8798}.d b{display:block;margin-top:5px}.hide{display:none}.mobile{display:none}@media(max-width:1000px){.shell{display:block}.side{display:none}.pulse{display:none}.main{padding:24px 16px 95px}.mobile{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;height:78px;background:#fffffff0;backdrop-filter:blur(15px);border-top:1px solid var(--l);z-index:50}.mobile button{border:0;background:none;font-size:10px;font-weight:800;color:#7a8494}.mobile button.on{color:var(--o)}h1{font-size:37px}.cards,.priority,.modules{grid-template-columns:1fr 1fr}.top{height:70px;padding:11px 14px}.brand b{font-size:18px}.brand small{font-size:10px}.metrics{grid-template-columns:1fr}.details{grid-template-columns:1fr 1fr}}@media(max-width:620px){.cards,.priority,.modules,.stats{grid-template-columns:1fr}.row p,.module p{min-height:0}.hero{padding:20px}.hero h2{font-size:28px}.sh h3{font-size:21px}.main{padding-top:20px}.details{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="brand"><span class="logo"></span><div><b>Construction OS</b><small>by CodeBridge · Executive Construction Intelligence</small></div></div><div class="pulse"><span><i></i>3 active projects</span><span>6 priority actions</span><span>Live command centre</span></div></header><div class="shell"><aside class="side"><nav class="nav" id="nav"><button class="on" data-r="home"><span>⌂</span>Executive Home</button><button data-r="projects"><span>▦</span>Projects</button><button data-r="field"><span>◇</span>Field Operations</button><button data-r="costs"><span>$</span>Commercial Control</button><button data-r="more"><span>⊞</span>Platform Modules</button></nav><div class="sidebox"><b>One connected workspace</b>Project delivery, site capture, cost control and executive visibility without disconnected spreadsheets, chats and paperwork.</div></aside><main class="main" id="main"></main></div><nav class="mobile" id="mobile"><button class="on" data-r="home">⌂<br>Home</button><button data-r="projects">▦<br>Projects</button><button data-r="field">◇<br>Field</button><button data-r="costs">$<br>Costs</button><button data-r="more">⊞<br>More</button></nav><div id="modal"></div><script>const M=document.getElementById('main'),X=document.getElementById('modal'),navs=[document.getElementById('nav'),document.getElementById('mobile')];let r='home';const P=[['Harbourview Residences','Sydney, NSW','68%','A$28.1m','7','On track','Structure and facade are progressing to plan. Two design responses are due today.'],['Riverside Medical Centre','Brisbane, QLD','41%','A$11.9m','10','Attention','Services coordination is creating a 3-day programme risk. Commercial impact remains contained.'],['Northline Logistics Hub','Melbourne, VIC','87%','A$8.4m','13','On track','Fit-out and commissioning are underway. Handover documentation is the current focus.']];function H(t,s){return `<div class="ey">PORTFOLIO COMMAND CENTRE</div><h1>${t}</h1><p class="sub">${s}</p>`}function A(id,i,t,p,g){return `<button class="row" data-a="${id}"><div class="ico">${i}</div><b>${t}</b><p>${p}</p><span class="tag">${g}</span></button>`}function home(){return H('Build with certainty.','A premium command centre connecting site operations, commercial control and executive visibility in one construction platform.')+`<div class="hero"><div class="heroTop"><div><div class="ey" style="color:#aab8cc">FOCUS PROJECT</div><h2>Harbourview Residences</h2><p>Sydney, NSW · Structure + facade · High-rise residential</p></div><span class="status">On track</span></div><div class="metrics"><div class="metric"><small>Contract value</small><b>A$28.4m</b><em>Approved project budget</em></div><div class="metric"><small>Forecast final cost</small><b>A$28.1m</b><em>Trending favourable</em></div><div class="metric"><small>Open RFIs</small><b>7</b><em>2 need same-day response</em></div></div><div class="track"><i></i></div></div><section class="section"><div class="sh"><div><h3>Portfolio performance</h3><p>The numbers leadership needs immediately.</p></div><span class="live">● LIVE</span></div><div class="cards"><div class="card"><small>Active portfolio</small><b>A$48.8m</b><span class="trend">1.1% under forecast</span></div><div class="card"><small>Safety</small><b>0 LTIs</b><span class="trend">31 days injury-free</span></div><div class="card"><small>Site workforce</small><b>173</b><span class="trend">Across 3 projects</span></div><div class="card"><small>Priority actions</small><b>6</b><span class="trend warn">2 due today</span></div></div></section><section class="section"><div class="sh"><div><h3>Priority workflow</h3><p>Click an item to see how issues and decisions are controlled.</p></div></div><div class="priority">${A('rfi','?','RFI-118 · Slab penetration','Architect response needed by 2:00 PM to prevent a two-day programme impact.','ANSWER TODAY')}${A('inspect','✓','Pre-pour inspection · Zone C','Quality and services checks must be completed before concrete is released.','3 ITEMS LEFT')}${A('variation','$','VO-042 · Facade revision','Scope change awaiting approval with cost, margin and time impact visible.','A$84,600')}</div></section>`}function projects(){return H('Every build, one view.','Compare project progress, expected final cost, design pressure and delivery risk from one screen.')+`<div class="projects">${P.map((p,i)=>`<div class="project" data-a="p${i}"><div class="pt"><div><h3>${p[0]}</h3><p>${p[1]}</p></div><span class="health ${p[5]=='Attention'?'att':''}">${p[5]}</span></div><div class="stats"><div class="stat"><small>Physical progress</small><b>${p[2]}</b></div><div class="stat"><small>Forecast final cost</small><b>${p[3]}</b></div><div class="stat"><small>Open RFIs</small><b>${p[4]}</b></div></div><p class="note">${p[6]}</p></div>`).join('')}</div>`}const mods=[['diary','✎','Site Diary','Daily labour, weather, plant, deliveries, delays and site notes.'],['inspect','✓','Inspections','Digital quality and safety checks before critical work is released.'],['defect','!','Defect Management','Capture issues, assign trades, set deadlines and verify closure.'],['photos','▧','Progress Photos','Timestamped visual progress organised by level, trade and package.'],['times','◷','Timesheets','Capture crew hours and connect labour to productivity reporting.'],['swms','⚑','SWMS & Safety','Worker safety documents, acknowledgements and compliance records.']];function field(){return H('Field operations.','A mobile-first workspace for supervisors, engineers and site teams. Everything captured here becomes visible to the office immediately.')+`<div class="modules">${mods.map(x=>`<button class="module" data-a="${x[0]}"><div class="mi">${x[1]}</div><b>${x[2]}</b><p>${x[3]}</p><span class="tag">OPEN WORKFLOW</span></button>`).join('')}</div>`}function costs(){return H('Commercial control.','Understand commitments, actual spend, cash position, change exposure and expected final outcome before margin moves.')+`<div class="cost"><div class="ey">EXPECTED FINAL PROJECT COST</div><div class="big">A$28.10m</div><p>Based on current commitments, actual costs and known changes, Harbourview is presently trending approximately <b>A$310k favourable</b> to contract allowance.</p><div class="bars"><div>Committed to subcontractors · A$23.6m<div class="bar"><i style="width:84%"></i></div></div><div>Cost incurred · A$18.9m<div class="bar o"><i style="width:67%"></i></div></div><div>Invoices paid · A$17.2m<div class="bar g"><i style="width:61%"></i></div></div></div></div><section class="section"><div class="sh"><div><h3>Live variations</h3><p>Scope changes with financial and programme impact.</p></div></div><div class="priority">${A('variation','$','VO-042 · Facade revision','Pending client approval. Client price A$84,600 with +2 days time impact.','ACTION NEEDED')}${A('variation2','✓','VO-039 · Drainage redesign','Approved and already included in the latest project forecast.','APPROVED')}</div></section>`}function more(){return H('Platform modules.','Expand the operating system with design management, programme, resource, analytics and compliance tools.')+`<div class="modules">${[['drawing','▤','Documents & Drawings','Latest revisions, specifications and markups.'],['rfi','?','RFIs & Submittals','Design questions, responses and approvals.'],['programme','▥','Programme & Lookahead','Milestones, dependencies and three-week planning.'],['resources','♟','Resources & Equipment','Labour, skills, crews and plant utilisation.'],['analytics','⌁','Executive Analytics','Portfolio KPIs, risks and commercial signals.'],['swms','⚑','Safety & Compliance','SWMS, inspections and auditable sign-offs.']].map(x=>`<button class="module" data-a="${x[0]}"><div class="mi">${x[1]}</div><b>${x[2]}</b><p>${x[3]}</p><span class="tag">CONNECTED</span></button>`).join('')}</div>`}function render(){M.innerHTML=r=='home'?home():r=='projects'?projects():r=='field'?field():r=='costs'?costs():more();navs.forEach(n=>n.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r==r)));scrollTo(0,0)}function D(a,b,c,d,e,f,g,h){return `<div class="details">${[[a,b],[c,d],[e,f],[g,h]].map(x=>`<div class="d"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`}function pop(id){let t='Construction OS',p='This clickable prototype demonstrates how the workflow connects field and office teams.',d='';if(id=='rfi'){t='RFI-118 · Slab penetration';p='RFI means Request for Information — a formal design question raised when the site team needs clarification before work continues.';d=D('Status','Awaiting architect','Due','Today · 2 PM','Risk','+2 days','Owner','Design manager')}if(id=='inspect'){t='Pre-pour inspection';p='The site cannot pour concrete until critical quality and services checks are verified and released.';d=D('Reinforcement','Passed','Formwork','Passed','Services','Pending','Release','Pending')}if(id=='variation'||id=='variation2'){t=id=='variation'?'VO-042 · Facade revision':'VO-039 · Drainage redesign';p='A variation records a scope change and shows its commercial and programme impact before approval.';d=D('Client price',id=='variation'?'A$84,600':'A$27,200','Cost',id=='variation'?'A$61,400':'Included','Margin',id=='variation'?'A$23,200':'Protected','Time',id=='variation'?'+2 days':'Nil')}if(id[0]=='p'){let q=P[+id[1]];t=q[0];p=q[6];d=D('Progress',q[2],'Forecast',q[3],'Open RFIs',q[4],'Health',q[5])}if(mods.some(x=>x[0]==id)){let q=mods.find(x=>x[0]==id);t=q[2];p=q[3]}if(id=='drawing'){t='Documents & Drawings';p='Everyone works from the latest approved revision, reducing rework caused by outdated information.'}if(id=='programme'){t='Programme & Lookahead';p='Connect milestones, blockers and short-term site planning in one shared timeline.'}if(id=='resources'){t='Resources & Equipment';p='See where labour and plant are allocated and where projects may be under-resourced.'}if(id=='analytics'){t='Executive Analytics';p='Turn project information into portfolio-level KPI, cost, safety and risk insight.'}X.innerHTML=`<div class="modal"><div class="sheet"><button class="close">×</button><div class="ey">INTERACTIVE WORKFLOW</div><h2>${t}</h2><p>${p}</p>${d}</div></div>`}document.addEventListener('click',e=>{let n=e.target.closest('[data-r]');if(n){r=n.dataset.r;render();return}let a=e.target.closest('[data-a]');if(a){pop(a.dataset.a);return}if(e.target.closest('.close')||e.target.classList.contains('modal'))X.innerHTML=''});render();</script></body></html>
