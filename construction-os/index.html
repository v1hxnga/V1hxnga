<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1325"><title>Construction OS — CodeBridge</title><style>html,body{margin:0;background:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{height:100vh;display:grid;place-items:center;color:#0b1220}.mark{width:42px;height:42px;border-radius:13px;background:#071225;position:relative;box-shadow:0 10px 30px rgba(11,18,32,.18)}.mark:after{content:"";position:absolute;inset:10px;background:#ff6b35;border-radius:5px;animation:p 1s ease-in-out infinite alternate}@keyframes p{to{transform:scale(.65);opacity:.65}}</style></head><body><div class="boot"><div class="mark"></div></div><script>(async()=>{try{const files=12;const parts=await Promise.all(Array.from({length:files},(_,i)=>fetch('/c'+i+'.txt',{cache:'no-store'}).then(r=>r.text())));const b=atob(parts.join(''));const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="boot">Unable to load Construction OS.</div>'}})();</script></body></html>
